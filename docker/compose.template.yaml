# Plantilla versionada. install.sh crea compose.yaml sin sobreescribirlo.
name: minecraft-lan
services:
  minecraft:
    image: ${RUNTIME_IMAGE:?Falta RUNTIME_IMAGE}
    platform: linux/arm64
    pull_policy: never
    user: "10000:10000"
    init: true
    restart: unless-stopped
    stop_grace_period: 180s
    mem_limit: 3g
    memswap_limit: 3g
    environment:
      JAVA_XMS: 512M
      JAVA_XMX: 2048M
      # RakNet para clientes actuales y NetherNet para Bedrock 26.60+.
      GEYSER_TRANSPORT: both
      GEYSER_WEBRTC_PORT: "19133"
      GEYSER_ADVERTISE_ADDRESSES: "${LAN_IP:?Falta LAN_IP}:19133"
      # Plugins gestionados desactivados por el operador (manage.sh plugin bluemap off).
      MCLAN_DISABLED_PLUGINS: "${DISABLED_PLUGINS:-}"
      # Dirección con la que MclanPacks ofrece los paquetes de recursos Java a los clientes.
      MCLAN_PACKS_URL: "http://${LAN_IP:?Falta LAN_IP}:8101/"
    ports:
      - "${LAN_IP:?Falta LAN_IP}:25565:25565/tcp"
      - "${LAN_IP:?Falta LAN_IP}:19132:19132/udp"
      # Signaling NetherNet integrado (TCP) y tráfico WebRTC (UDP).
      - "${LAN_IP:?Falta LAN_IP}:19132:19132/tcp"
      - "${LAN_IP:?Falta LAN_IP}:19133:19133/udp"
      # Web de BlueMap (mapa y jugadores en vivo), sólo en la LAN.
      - "${LAN_IP:?Falta LAN_IP}:8100:8100/tcp"
      # Descarga de paquetes de recursos Java (MclanPacks), sólo en la LAN.
      - "${LAN_IP:?Falta LAN_IP}:8101:8101/tcp"
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./releases/${RELEASE_ID:?Falta RELEASE_ID}
        target: /opt/release
        read_only: true
        bind:
          create_host_path: false
      # Paquetes de recursos que elige manage.sh pack: de root y de sólo lectura para el servidor.
      - type: bind
        source: ./packs
        target: /opt/packs
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    healthcheck:
      test: [CMD, python3, /opt/mclan/probe.py, health]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 240s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
